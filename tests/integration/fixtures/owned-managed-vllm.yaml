# Run from repository root. Requires two visible CUDA GPUs and a fresh control_dir.
model:
  target_model_path: Qwen/Qwen3-0.6B
  target_revision: c1899de289a04d12100db370d81485cdf75e47ca
  target_backend: vllm
  draft_num_hidden_layers: 2
  draft_block_size: 4
  target_layer_ids: [3, 24]
  torch_dtype: bfloat16
  trust_remote_code: false
  vllm_gpu_memory_utilization: 0.4
data:
  train_data_path: tests/integration/fixtures/owned-teacher-conversations.jsonl
  chat_template: qwen
  max_length: 128
  cache_dir: outputs/owned-managed-vllm/cache
training:
  strategy: dspark
  max_steps: 2
  batch_size: 1
  accumulation_steps: 1
  fsdp_version: v2
  attention_backend: flex_attention
  num_anchors: 4
  objective_chunk_blocks: 4
  save_interval: 2
deployment:
  mode: disaggregated
  trainer:
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/owned-managed-vllm/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices: ["1"]
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 268435456
        local_buffer_size_bytes: 67108864
      capture_servers:
        - port: 30000
          startup_timeout_s: 600
          cuda_visible_devices: ["0"]
          tp_size: 1
output_dir: outputs/owned-managed-vllm/checkpoints
run_id: owned-managed-vllm
