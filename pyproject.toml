[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dspark-train-platform"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
description = "Train and fine-tune speculative decoding drafts on your own data"
authors = [{name = "SGLang Team"}]
maintainers = [{name = "JayYun98"}]
urls = {Homepage = "https://github.com/JayYun98/dspark-train-platform", Upstream = "https://github.com/sgl-project/SpecForge"}
dependencies = [
    "torch==2.11.0",
    "transformers==5.8.1",
    "datasets",
    "tqdm",
    "accelerate",
    "huggingface-hub",
    "numpy",
    "openai-harmony",
    "pydantic",
    "psutil",
    "pyyaml",
    "safetensors",
    "sglang==0.5.14",
    "requests",
    "tensorboard",
    "typing-extensions",
    "wandb",
    "yunchang",
]

[project.scripts]
dspark = "specforge.cli:main"
specforge = "specforge.cli:main"

[tool.setuptools.packages.find]
include = ["specforge*"]
exclude = ["build*", "configs*", "dist*", "scripts*", "tests*"]

[project.optional-dependencies]
data = ["openai"]
dev = [
    "pre-commit",
]
fa = ["flash-attn", "ninja", "packaging"]
liger = ["liger-kernel"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}
