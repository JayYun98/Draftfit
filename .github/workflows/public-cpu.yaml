name: Public CPU gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.18'
      - name: Install locked CPU dependencies (no inference server)
        run: |
          uv venv --seed
          uv pip sync requirements-cpu.lock --torch-backend cpu --require-hashes
      - name: Run offline public regression gate
        run: .venv/bin/python -m tests.public_cpu
      - name: Install wheel and exercise CLI outside checkout
        run: |
          .venv/bin/python -m pip wheel --no-deps --no-build-isolation . -w dist
          .venv/bin/python -m pip install --no-deps dist/*.whl
          .venv/bin/python -I scripts/check_public_install.py
      - name: Check whitespace
        run: git diff --check
