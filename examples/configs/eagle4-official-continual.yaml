# Pin compatible local target and official draft directories before running.
# The checkpoint supplies its original architecture and tap configuration.
model:
  target_model_path: /path/to/pinned-target
  draft_checkpoint_path: /path/to/official-eagle4
  torch_dtype: bfloat16
data:
  hidden_states_path: /path/to/train-features
  max_length: 2048
training:
  strategy: eagle4
  eagle4_stage: draft
  eagle4_initialize_candidates: false
  attention_backend: sdpa
  max_steps: 3000
  num_epochs: 100
  batch_size: 1
  learning_rate: 0.000003
  lr_scheduler: wsd
  warmup_ratio: 0.05
  lr_decay_ratio: 0.20
  min_lr_ratio: 0.10
  lr_decay_style: linear
  dist_timeout: 20
  max_grad_norm: 0.5
  ttt_length: 7
  save_interval: 500
  log_interval: 50
  seed: 0
output_dir: ./outputs/eagle4-official-continual
run_id: eagle4-official-continual
deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
