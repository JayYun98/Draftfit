# GPU_PENDING: experimental Ampere path, NOT a supported Ling combination.
# Linux CUDA only; Ampere SM80 (A100).
# Expected image: lmsysorg/sglang:dev-cu12-Ling-3.0-tiny
# Expected SGLang: 8ba213fc67550aea80dfbd5ef66f4574ec25e653
# Expected torch: 2.13.0+cu129; CUDA runtime: 12.9.
# Historical Ling fused-top-k failure is not fixed by selecting Triton attention.
- model.sglang_attention_backend=triton
- model.sglang_linear_attn_backend=triton
- model.sglang_linear_attn_verify_backend=triton
- model.sglang_enable_deterministic_inference=true
- model.sglang_disable_cuda_graph=true
